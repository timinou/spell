[package]
name = "pi-knowledge-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
pi-workspace-cache = { path = "../pi-workspace-cache" }
petgraph = { version = "0.8", features = ["serde-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
thiserror = "2"
chrono = "0.4"
usearch = "2.25.2"

[dev-dependencies]
tempfile = "3"
