[package]
name = "pi-knowledge-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "pi_knowledge_worker"
path = "src/lib.rs"

[[bin]]
name = "pi-knowledge-worker"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fastembed = "5"
pi-knowledge-core = { path = "../pi-knowledge-core" }
pi-org-engine = { path = "../pi-org-engine" }
pi-code-graph = { path = "../pi-code-graph" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
clap = { version = "4", features = ["derive"] }
fd-lock = "4"
nix = { version = "0.29", features = ["signal", "process", "fs", "poll", "user", "sched"] }
libc = "0.2"

[dev-dependencies]
nix = { version = "0.29", features = ["signal"] }
tempfile = "3"
