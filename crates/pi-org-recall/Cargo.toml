blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[features]
default = ["test-mock"]
test-embedding = []
test-mock = []
