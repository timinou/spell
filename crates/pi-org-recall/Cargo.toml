[package]
name = "pi-org-recall"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
pi-org-engine = { path = "../pi-org-engine" }
pi-code-vectors = { path = "../pi-code-vectors" }
