[package]
name = "pi-org-recall"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
pi-org-engine = { path = "../pi-org-engine" }
pi-code-vectors = { path = "../pi-code-vectors" }
tantivy = "0.26"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[features]
# `test-mock` exposes a blake3-derived `MockEmbedder` used by this crate's
# integration tests. It MUST NOT ship in production binaries: production
# embeddings route through `pi-embedding-worker` via the adapter in
# `pi-natives::recall_engine`. Tests opt in explicitly via
# `cargo test -p pi-org-recall --features test-mock`; CI runs them under
# that flag. The `-p` is required because the feature is crate-local; a
# bare `cargo test --features test-mock` from the workspace root fails.
default = []
test-embedding = []
test-mock = []
