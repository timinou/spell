[package]
name = "pi-edit-broker"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "pi-edit-broker"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = [
   "rt-multi-thread",
   "macros",
   "net",
   "sync",
   "io-util",
   "time",
   "signal",
   "process",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.29", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = [
   "rt-multi-thread",
   "macros",
   "net",
   "sync",
   "io-util",
   "time",
   "signal",
   "process",
   "test-util",
] }

[lints]
workspace = true
